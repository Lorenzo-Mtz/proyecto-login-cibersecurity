{% extends "base.html" %}
{% block title %}Actualizar Contraseña{% endblock %}
{% block content %}
<div class="card">
  <h1>Actualizar Contraseña</h1>
  <form method="post" action="{{ url_for('auth.reset_password_submit') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input type="hidden" name="token" value="{{ token }}">

    <label for="password">Contrasena</label>
    <input type="password" id="password" name="password" required>

    <label for="confirm_password">Confirmar contrasena</label>
    <input type="password" id="confirm_password" name="confirm_password" required>

    <button type="submit">Confirmar</button>
  </form>
  <p class="switch-link"><a href="{{ url_for('auth.login') }}">Volver a iniciar sesión</a></p>
</div>
{% endblock %}
