{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="card">
  <h1>Hola, {{ username }}</h1>
  <p>Sesion activa.</p>
  <form method="post" action="{{ url_for('auth.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Cerrar sesion</button>
  </form>
</div>
{% endblock %}
